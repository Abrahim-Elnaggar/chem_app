<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chemistry Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #4CAF50;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .question-block {
            margin-bottom: 20px;
        }
        .question-block p {
            font-weight: 700;
        }
        .question-block label {
            display: block;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
        .question-block input[type="radio"] {
            display: none;
        }
        .selected {
            background-color: #2196F3;
            color: white;
        }
        .correct {
            background-color: #4CAF50;
            color: white;
        }
        .incorrect {
            background-color: #F44336;
            color: white;
        }
        .submit-button {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .submit-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h2>Chemistry Puzzle</h2>
    <div class="form-container">
        <form id="puzzle-form" method="POST">
            {% for question in questions %}
                <div class="question-block" id="question-{{ question.id }}">
                    <p>{{ question.question_text }}</p>
                    <label>
                        <input type="radio" name="question-{{ question.id }}" value="a" data-correct="{{ question.correct_option }}"> {{ question.option_a }}
                    </label>
                    <label>
                        <input type="radio" name="question-{{ question.id }}" value="b" data-correct="{{ question.correct_option }}"> {{ question.option_b }}
                    </label>
                    <label>
                        <input type="radio" name="question-{{ question.id }}" value="c" data-correct="{{ question.correct_option }}"> {{ question.option_c }}
                    </label>
                    <label>
                        <input type="radio" name="question-{{ question.id }}" value="d" data-correct="{{ question.correct_option }}"> {{ question.option_d }}
                    </label>
                </div>
            {% endfor %}
            <input type="submit" class="submit-button" value="Submit">
        </form>
    </div>

    <script>
        document.querySelectorAll('.question-block input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const labels = this.closest('.question-block').querySelectorAll('label');
                labels.forEach(label => label.classList.remove('selected'));
                this.parentElement.classList.add('selected');
            });
        });

        document.getElementById('puzzle-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const form = event.target;
            const questions = document.querySelectorAll('.question-block');
            let allCorrect = true;

            questions.forEach(question => {
                const radios = question.querySelectorAll('input[type="radio"]');
                let selectedAnswer = '';
                let correctAnswer = '';
                radios.forEach(radio => {
                    if (radio.checked) {
                        selectedAnswer = radio.value;
                    }
                    if (radio.getAttribute('data-correct') === radio.value) {
                        correctAnswer = radio.value;
                    }
                });

                radios.forEach(radio => {
                    const label = radio.parentElement;
                    if (radio.value === selectedAnswer) {
                        if (selectedAnswer === correctAnswer) {
                            label.classList.add('correct');
                        } else {
                            label.classList.add('incorrect');
                            allCorrect = false;
                        }
                    }
                    if (radio.value === correctAnswer) {
                        label.classList.add('correct');
                    }
                });
            });

            setTimeout(() => {
                window.location.reload();
            }, 3000);
        });
    </script>
</body>
</html>
